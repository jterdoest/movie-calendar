# Movie release calendar settings.
# Edit these and push — the next build picks them up.

[calendar]
name = "🍿 Movie Releases"
description = "US theatrical releases with details from TMDB."
event_prefix = "🍿 "
# How often subscribed apps should re-check the feed (ISO 8601 duration).
refresh_interval = "PT12H"

[releases]
region = "US"
# TMDB release types: 1 Premiere, 2 Theatrical (limited), 3 Theatrical, 4 Digital, 5 Physical, 6 TV
# 3 = wide theatrical only. Use [2, 3] to also include limited releases.
release_types = [3]
days_back = 60       # keep recent releases on the calendar this long
days_ahead = 365     # look this far into the future
# Skip obscure titles. TMDB popularity is relative: big nationwide releases usually
# score well above 15. Lower it to see more, 0 includes everything. Each build's
# Actions run page lists what was kept, filtered, and just missed the cutoff.
min_popularity = 15.0
# Leave out re-releases and anniversary runs of older films.
exclude_rereleases = true
# Ignore release entries whose TMDB note contains any of these (case-insensitive).
# Catches event screenings and limited runs entered as "Theatrical". A movie that
# also has a plain wide-release entry is kept and dated by that entry.
exclude_note_keywords = [
  "fathom", "one night", "one-night", "limited", "event", "special screening",
  "special engagement", "sneak", "early access", "fan screening", "festival",
]
# Hard cap on how many discover pages to read (20 movies per page).
max_pages = 25

[streaming]
# Streaming-original movies: a US digital premiere for a film that never had a US wide
# theatrical release (theater movies arriving on rental/streaming are left out).
enabled = true
# Only include titles identified as being on one of the services below.
require_major_service = true

# Label shown in the event title → words to look for in TMDB's US streaming providers
# or the release note (case-insensitive, whole words). Delete a line to drop a service.
[streaming.services]
"Netflix" = ["netflix"]
"Prime Video" = ["prime video", "amazon prime"]
"Apple TV" = ["apple tv"]
"Disney+" = ["disney plus", "disney"]
"HBO Max" = ["hbo max", "max"]
"Hulu" = ["hulu"]
"Paramount+" = ["paramount plus", "paramount"]
"Peacock" = ["peacock"]

[events]
# Optional alert, relative to midnight at the start of release day (ISO 8601 duration).
# "" = no alert, "PT9H" = 9 AM on release day, "-PT15H" = 9 AM the day before.
alert = ""
top_cast = 4
